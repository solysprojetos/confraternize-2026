<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Acompanhamento das Inscrições</title>
<!--
  Painel pessoal: junta, numa tela só, as inscrições da Confraternização 2026
  e do Mulheres Curadas. Não há link para esta página em lugar nenhum.

  - Confraternização: login do administrador no Supabase deste projeto
    (o mesmo e-mail e senha da área /#/admin). Só esse e-mail lê a tabela.
  - Mulheres Curadas: senha do painel (/painel do site mulherescuradas.com),
    conferida pela Edge Function "painel" do outro projeto Supabase.

  Os dois acessos ficam guardados só neste aparelho; "Sair" apaga.
-->
<style>
  :root {
    --fundo: #f6f3ec;
    --papel: #ffffff;
    --tinta: #14213d;
    --suave: #5b6478;
    --linha: #e3ddd0;
    --ouro: #b08d3c;
    --confra: #1f3a6e;
    --mc: #b0476b;
    --ok: #2f7d4f;
    --alerta: #a8661a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0f1626;
      --papel: #16203a;
      --tinta: #eef0f5;
      --suave: #a3abc0;
      --linha: #26314f;
      --ouro: #d4b064;
      --confra: #7fa3e6;
      --mc: #e88aaa;
      --ok: #6fc394;
      --alerta: #e0a35a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--tinta);
    font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    max-width: 1200px; margin: 0 auto; padding: 24px 16px 8px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between;
  }
  h1 { margin: 0; font: 400 30px/1.1 "Instrument Serif", Georgia, serif; }
  .sub { color: var(--suave); font-size: 13px; }
  .acoes { display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit; font-size: 14px; cursor: pointer;
    border: 1px solid var(--linha); background: var(--papel); color: var(--tinta);
    border-radius: 8px; padding: 8px 14px;
  }
  button:hover { border-color: var(--ouro); }
  button.principal { background: var(--tinta); color: var(--fundo); border-color: var(--tinta); }
  main {
    max-width: 1200px; margin: 0 auto; padding: 8px 16px 40px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px;
  }
  .geral { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  section.evento {
    background: var(--papel); border: 1px solid var(--linha); border-radius: 14px;
    padding: 18px; border-top: 4px solid var(--cor); min-width: 0;
  }
  .evento h2 { margin: 0; font: 400 24px/1.15 "Instrument Serif", Georgia, serif; }
  .evento .quando { color: var(--suave); font-size: 13px; margin-top: 2px; }
  .numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .num, .geral > div {
    background: var(--fundo); border-radius: 10px; padding: 10px 12px; min-width: 0;
  }
  .geral > div { background: var(--papel); border: 1px solid var(--linha); }
  .num b, .geral b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .num span, .geral span { color: var(--suave); font-size: 12px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin: 18px 0 8px; font-weight: 600; }
  .meta { height: 8px; background: var(--fundo); border-radius: 99px; overflow: hidden; }
  .meta > i { display: block; height: 100%; background: var(--cor); border-radius: 99px; }
  .dias { display: flex; align-items: end; gap: 3px; height: 90px; }
  .dias > div { flex: 1; display: flex; flex-direction: column; justify-content: end; align-items: center; height: 100%; min-width: 0; }
  .dias i { display: block; width: 100%; background: var(--cor); border-radius: 3px 3px 0 0; min-height: 1px; opacity: .85; }
  .dias small { font-size: 10px; color: var(--suave); margin-top: 3px; }
  .dias em { font-style: normal; font-size: 10px; color: var(--tinta); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .barras .linha { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 8px; font-size: 14px; }
  .barras .linha .meta { grid-column: 1 / -1; height: 6px; }
  ul.ultimas { list-style: none; margin: 0; padding: 0; }
  ul.ultimas li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--linha); font-size: 14px; }
  ul.ultimas li:last-child { border-bottom: 0; }
  ul.ultimas .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.ultimas .det { color: var(--suave); font-size: 12px; white-space: nowrap; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--linha); color: var(--suave); margin-left: 6px; }
  .tag.nao { color: var(--alerta); border-color: var(--alerta); }
  form.login { display: grid; gap: 10px; margin-top: 16px; }
  input {
    font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--linha);
    background: var(--fundo); color: var(--tinta); width: 100%;
  }
  input:focus { outline: 2px solid var(--ouro); outline-offset: 1px; }
  .erro { color: var(--alerta); font-size: 13px; min-height: 1em; }
  .rodape { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; font-size: 12px; color: var(--suave); }
  .rodape a { color: var(--suave); }
  .link { background: none; border: 0; padding: 0; color: var(--suave); text-decoration: underline; font-size: 12px; }
  @media (max-width: 420px) { .numeros { grid-template-columns: repeat(2, 1fr); } main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Acompanhamento das inscrições</h1>
    <div class="sub" id="atualizado">Carregando…</div>
  </div>
  <div class="acoes">
    <button type="button" id="atualizar">Atualizar agora</button>
  </div>
</header>

<main>
  <div class="geral" id="geral" hidden></div>
  <section class="evento" id="confra" style="--cor: var(--confra)"></section>
  <section class="evento" id="mc" style="--cor: var(--mc)"></section>
</main>

<script>
"use strict";

// ---------------------------------------------------------------- dados fixos
const CONFRA = {
  url: "https://qozuvdhqhpzpreusvkkr.supabase.co",
  chave: "sb_publishable_BG6LttsyALYbyKjxASE9ag_xxAJMAge",
  nome: "Confraternização 2026",
  data: "2026-12-19T16:30:00-03:00",
  painel: "https://confragrupos.online/#/admin",
};
const MC = {
  endpoint: "https://vdjovchltmyhuvlwxzwr.supabase.co/functions/v1/painel",
  nome: "Mulheres Curadas",
  data: "2026-11-09T18:30:00-03:00",
  limite: 300,
  painel: "https://www.mulherescuradas.com/painel",
};
const NOME_GRUPO = {
  grupo_support: "Grupo Support",
  sgroup: "SGroup Nacional",
  solys: "Solys",
  parceiros: "Parceiros",
  convidados: "Convidados",
};
const CHAVE_CONFRA = "acompanhamento.confra";
const CHAVE_MC = "acompanhamento.mc";
const DIAS_GRAFICO = 14;

// ---------------------------------------------------------------- utilidades
const guardado = {
  ler(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  apagar(k) { try { localStorage.removeItem(k); } catch {} },
};
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (n) => n.toLocaleString("pt-BR");

/** Data local (fuso do aparelho) no formato AAAA-MM-DD, para agrupar por dia. */
function diaDe(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function ultimosDias(n) {
  const dias = [];
  const hoje = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() - i);
    dias.push(diaDe(d));
  }
  return dias;
}
function quandoFoi(iso) {
  const d = new Date(iso);
  const hoje = diaDe(new Date());
  const ontem = ultimosDias(2)[0];
  const hora = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (diaDe(d) === hoje) return `hoje ${hora}`;
  if (diaDe(d) === ontem) return `ontem ${hora}`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " " + hora;
}
function faltam(iso) {
  const agora = new Date();
  const alvo = new Date(iso);
  const dias = Math.round((new Date(alvo.getFullYear(), alvo.getMonth(), alvo.getDate()) - new Date(agora.getFullYear(), agora.getMonth(), agora.getDate())) / 86400000);
  const quando = alvo.toLocaleDateString("pt-BR", { day: "numeric", month: "long" });
  if (alvo < agora && dias < 0) return `${quando} · já aconteceu`;
  if (dias === 0) return `${quando} · é hoje!`;
  if (dias === 1) return `${quando} · é amanhã`;
  return `${quando} · faltam ${dias} dias`;
}

/** Resumo comum: total, hoje, 7 dias e a contagem por dia do gráfico. */
function resumoPorDia(datas) {
  const dias = ultimosDias(DIAS_GRAFICO);
  const conta = Object.fromEntries(dias.map((d) => [d, 0]));
  for (const iso of datas) {
    const d = diaDe(iso);
    if (d in conta) conta[d] += 1;
  }
  const hoje = conta[dias[dias.length - 1]];
  const semana = dias.slice(-7).reduce((s, d) => s + conta[d], 0);
  return { dias, conta, hoje, semana };
}

function graficoDias({ dias, conta }) {
  const maior = Math.max(1, ...dias.map((d) => conta[d]));
  return `<div class="dias" role="img" aria-label="Inscrições por dia nos últimos ${DIAS_GRAFICO} dias">${dias
    .map((d) => {
      const n = conta[d];
      const [, m, dia] = d.split("-");
      return `<div title="${dia}/${m}: ${n}"><em>${n || ""}</em><i style="height:${(n / maior) * 100}%"></i><small>${Number(dia)}</small></div>`;
    })
    .join("")}</div>`;
}

function barras(itens, total) {
  const maior = Math.max(1, ...itens.map(([, n]) => n));
  return `<div class="barras">${itens
    .map(
      ([rotulo, n]) => `<div class="linha"><span>${esc(rotulo)}</span><b>${fmt(n)}${total ? ` <span class="sub">${Math.round((n / total) * 100)}%</span>` : ""}</b><div class="meta"><i style="width:${(n / maior) * 100}%"></i></div></div>`,
    )
    .join("")}</div>`;
}

// ---------------------------------------------------------------- Confraternização
async function confraToken() {
  const s = guardado.ler(CHAVE_CONFRA);
  if (!s) return null;
  // Renova com folga de 1 minuto antes de vencer
  if (s.expira > Date.now() + 60000) return s.access_token;
  const r = await fetch(`${CONFRA.url}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: CONFRA.chave, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: s.refresh_token }),
  });
  if (!r.ok) { guardado.apagar(CHAVE_CONFRA); return null; }
  return salvarSessaoConfra(await r.json());
}
function salvarSessaoConfra(d) {
  guardado.gravar(CHAVE_CONFRA, {
    access_token: d.access_token,
    refresh_token: d.refresh_token,
    expira: Date.now() + (d.expires_in ?? 3600) * 1000,
  });
  return d.access_token;
}
async function confraLogin(email, senha) {
  const r = await fetch(`${CONFRA.url}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: CONFRA.chave, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password: senha }),
  });
  if (!r.ok) throw new Error("E-mail ou senha incorretos.");
  salvarSessaoConfra(await r.json());
}
async function confraCarregar() {
  const token = await confraToken();
  if (!token) return null;
  const r = await fetch(
    `${CONFRA.url}/rest/v1/inscricoes?select=nome_completo,grupo,setor,comparecera,convite_enviado,created_at&order=created_at.desc`,
    { headers: { apikey: CONFRA.chave, Authorization: `Bearer ${token}` } },
  );
  if (r.status === 401) { guardado.apagar(CHAVE_CONFRA); return null; }
  if (!r.ok) throw new Error("Não foi possível carregar as inscrições.");
  return r.json();
}

function confraDesenhar(lista) {
  const vai = (i) => i.comparecera !== false;
  const confirmados = lista.filter(vai);
  const recusas = lista.length - confirmados.length;
  const r = resumoPorDia(lista.map((i) => i.created_at));
  const porGrupo = Object.keys(NOME_GRUPO)
    .map((g) => [NOME_GRUPO[g], confirmados.filter((i) => i.grupo === g).length])
    .filter(([, n]) => n > 0)
    .sort((a, b) => b[1] - a[1]);
  const convites = confirmados.filter((i) => i.convite_enviado).length;

  return {
    total: lista.length,
    confirmados: confirmados.length,
    hoje: r.hoje,
    html: `
      <div class="numeros">
        <div class="num"><b>${fmt(confirmados.length)}</b><span>confirmados</span></div>
        <div class="num"><b>${fmt(r.hoje)}</b><span>hoje</span></div>
        <div class="num"><b>${fmt(r.semana)}</b><span>últimos 7 dias</span></div>
        <div class="num"><b>${fmt(recusas)}</b><span>não vão</span></div>
        <div class="num"><b>${fmt(lista.length)}</b><span>respostas</span></div>
        <div class="num"><b>${fmt(confirmados.length - convites)}</b><span>convites na fila</span></div>
      </div>
      <h3>Inscrições por dia</h3>${graficoDias(r)}
      <h3>Confirmados por empresa</h3>${barras(porGrupo, confirmados.length)}
      <h3>Últimas respostas</h3>
      <ul class="ultimas">${lista
        .slice(0, 8)
        .map(
          (i) => `<li><span class="nome">${esc(i.nome_completo)}${vai(i) ? "" : '<span class="tag nao">não vai</span>'}</span><span class="det">${esc(NOME_GRUPO[i.grupo] ?? i.grupo)} · ${quandoFoi(i.created_at)}</span></li>`,
        )
        .join("") || '<li class="det">Nenhuma inscrição ainda.</li>'}</ul>`,
  };
}

// ---------------------------------------------------------------- Mulheres Curadas
async function mcCarregar(senha) {
  senha = senha ?? guardado.ler(CHAVE_MC);
  if (!senha) return null;
  const r = await fetch(MC.endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-senha": senha },
    body: JSON.stringify({ acao: "listar" }),
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { guardado.apagar(CHAVE_MC); throw new Error("Senha incorreta."); }
  if (!r.ok) throw new Error(d.erro || "Não foi possível carregar as inscrições.");
  guardado.gravar(CHAVE_MC, senha);
  return d.inscricoes ?? [];
}

function mcDesenhar(lista) {
  const r = resumoPorDia(lista.map((i) => i.criado_em));
  const vagas = Math.max(0, MC.limite - lista.length);
  const pct = Math.min(100, (lista.length / MC.limite) * 100);
  const emails = lista.filter((i) => i.email_enviado_em).length;
  const presencas = lista.filter((i) => i.checkin_em).length;
  const igreja = lista.filter((i) => i.frequenta_igreja).length;

  return {
    total: lista.length,
    confirmados: lista.length,
    hoje: r.hoje,
    html: `
      <div class="numeros">
        <div class="num"><b>${fmt(lista.length)}</b><span>inscritas</span></div>
        <div class="num"><b>${fmt(r.hoje)}</b><span>hoje</span></div>
        <div class="num"><b>${fmt(r.semana)}</b><span>últimos 7 dias</span></div>
        <div class="num"><b>${fmt(vagas)}</b><span>vagas restantes</span></div>
        <div class="num"><b>${fmt(lista.length - emails)}</b><span>e-mail não saiu</span></div>
        <div class="num"><b>${fmt(presencas)}</b><span>presenças (check-in)</span></div>
      </div>
      <h3>Lotação · ${fmt(lista.length)} de ${fmt(MC.limite)} (${Math.round(pct)}%)</h3>
      <div class="meta"><i style="width:${pct}%"></i></div>
      <h3>Inscrições por dia</h3>${graficoDias(r)}
      <h3>Frequentam igreja</h3>${barras([["Sim", igreja], ["Não", lista.length - igreja]], lista.length)}
      <h3>Últimas inscrições</h3>
      <ul class="ultimas">${lista
        .slice(0, 8)
        .map(
          (i) => `<li><span class="nome">${esc(i.nome)}${i.email_enviado_em ? "" : '<span class="tag nao">sem e-mail</span>'}</span><span class="det">${i.igreja ? esc(i.igreja) + " · " : ""}${quandoFoi(i.criado_em)}</span></li>`,
        )
        .join("") || '<li class="det">Nenhuma inscrição ainda.</li>'}</ul>`,
  };
}

// ---------------------------------------------------------------- tela
const estado = { confra: null, mc: null };

function cabecalho(ev) {
  return `<h2>${ev.nome}</h2><div class="quando">${faltam(ev.data)}</div>`;
}
function rodape(ev, chave) {
  return `<div class="rodape"><a href="${ev.painel}" target="_blank" rel="noopener">Abrir o painel completo ↗</a><button type="button" class="link" data-sair="${chave}">Sair</button></div>`;
}

function telaLogin(id, ev, campos, erro = "") {
  const el = document.getElementById(id);
  // A atualização automática não apaga o que já está sendo digitado
  if (!erro && el.querySelector("form[data-login]")) return;
  el.innerHTML = `${cabecalho(ev)}
    <form class="login" data-login="${id}">
      ${campos}
      <div class="erro">${esc(erro)}</div>
      <button class="principal" type="submit">Entrar</button>
    </form>`;
}
const loginConfra = (erro) =>
  telaLogin("confra", CONFRA, `<input name="email" type="email" autocomplete="username" placeholder="E-mail do administrador" required />
    <input name="senha" type="password" autocomplete="current-password" placeholder="Senha" required />`, erro);
const loginMc = (erro) =>
  telaLogin("mc", MC, `<input name="senha" type="password" autocomplete="current-password" placeholder="Senha do painel Mulheres Curadas" required />`, erro);

function desenharGeral() {
  const el = document.getElementById("geral");
  const partes = [estado.confra, estado.mc].filter(Boolean);
  if (partes.length < 2) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `
    <div><b>${fmt(partes.reduce((s, p) => s + p.confirmados, 0))}</b><span>pessoas confirmadas nos dois eventos</span></div>
    <div><b>${fmt(partes.reduce((s, p) => s + p.hoje, 0))}</b><span>inscrições hoje</span></div>
    <div><b>${fmt(estado.confra.confirmados)}</b><span>Confraternização</span></div>
    <div><b>${fmt(estado.mc.confirmados)}</b><span>Mulheres Curadas</span></div>`;
}

async function atualizarConfra() {
  const el = document.getElementById("confra");
  try {
    const lista = await confraCarregar();
    if (!lista) { estado.confra = null; return loginConfra(); }
    estado.confra = confraDesenhar(lista);
    el.innerHTML = cabecalho(CONFRA) + estado.confra.html + rodape(CONFRA, "confra");
  } catch (e) {
    if (!estado.confra) el.innerHTML = cabecalho(CONFRA) + `<p class="erro">${esc(e.message)}</p>`;
  }
}
async function atualizarMc() {
  const el = document.getElementById("mc");
  try {
    const lista = await mcCarregar();
    if (!lista) { estado.mc = null; return loginMc(); }
    estado.mc = mcDesenhar(lista);
    el.innerHTML = cabecalho(MC) + estado.mc.html + rodape(MC, "mc");
  } catch (e) {
    if (e.message === "Senha incorreta.") { estado.mc = null; return loginMc(e.message); }
    if (!estado.mc) el.innerHTML = cabecalho(MC) + `<p class="erro">${esc(e.message)}</p>`;
  }
}

async function atualizarTudo() {
  document.getElementById("atualizado").textContent = "Atualizando…";
  await Promise.all([atualizarConfra(), atualizarMc()]);
  desenharGeral();
  document.getElementById("atualizado").textContent =
    `Atualizado às ${new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })} · atualiza sozinho a cada minuto`;
}

document.addEventListener("submit", async (e) => {
  const form = e.target.closest("form[data-login]");
  if (!form) return;
  e.preventDefault();
  const qual = form.dataset.login;
  const dados = new FormData(form);
  const botao = form.querySelector("button");
  botao.disabled = true;
  botao.textContent = "Entrando…";
  try {
    if (qual === "confra") await confraLogin(String(dados.get("email")).trim(), String(dados.get("senha")));
    else await mcCarregar(String(dados.get("senha")));
    await atualizarTudo();
  } catch (erro) {
    (qual === "confra" ? loginConfra : loginMc)(erro.message);
  }
});

document.addEventListener("click", (e) => {
  const sair = e.target.closest("[data-sair]");
  if (sair) {
    guardado.apagar(sair.dataset.sair === "confra" ? CHAVE_CONFRA : CHAVE_MC);
    estado[sair.dataset.sair] = null;
    atualizarTudo();
  }
});
document.getElementById("atualizar").addEventListener("click", atualizarTudo);

atualizarTudo();
setInterval(() => { if (!document.hidden) atualizarTudo(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) atualizarTudo(); });
</script>
</body>
