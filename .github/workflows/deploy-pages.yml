name: Deploy no GitHub Pages

on:
  push:
    branches:
      - main
      - claude/analise-processo-completo-23nzht
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-e-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build estático (formulário de inscrição)
        run: bun run build:pages

      # Publica o conteúdo de dist-pages no branch gh-pages; o GitHub Pages
      # serve esse branch em https://<owner>.github.io/confraternize-2026/
      - name: Publicar no branch gh-pages
        run: |
          cd dist-pages
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy do formulário (commit ${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
