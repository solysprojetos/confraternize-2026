name: Deploy no GitHub Pages

on:
  push:
    branches:
      - main
      - claude/analise-processo-completo-23nzht
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build estático (formulário de inscrição)
        run: bun run build:pages
        env:
          PAGES_BASE: /confraternize-2026/

      # Mantém o branch gh-pages atualizado como espelho do build, para o
      # caso de o Pages estar configurado com "Deploy from a branch"
      - name: Atualizar branch gh-pages
        run: |
          cd dist-pages
          touch .nojekyll
          # Impede a Vercel de tentar (e falhar) um deploy de preview deste branch
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy do formulário (commit ${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Publicar artefato
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    continue-on-error: true
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
